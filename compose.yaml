# Non-Unraid hosts. Unraid users install the template instead
# (unraid/claude-code-linux.xml); this file encodes the same ports, paths,
# /dev/shm size and PUID/PGID/UMASK defaults so the two cannot drift.
#
#   cp .env.example .env   # no desktop login: the reverse proxy is the gate
#   docker compose up -d

services:
  claude-code-linux:
    # :latest is a moving tag that GitHub Actions re-points whenever Anthropic
    # publishes a newer claude-desktop .deb or a newer Claude Code CLI.
    image: ${CLAUDE_IMAGE:-ghcr.io/prv-ctech/claude-code-linux:latest}
    container_name: ${CLAUDE_NAME:-claude-code-linux}
    restart: unless-stopped
    # Docker's default 64 MB /dev/shm kills Chrome's renderers.
    shm_size: ${CLAUDE_SHM_SIZE:-2gb}
    environment:
      # The ids that own your host folders (Unraid: 99/100), and the mask for new
      # files. The host-side names are namespaced so an ambient PUID/PGID in the
      # host environment cannot change them unnoticed.
      PUID: ${CLAUDE_PUID:-99}
      PGID: ${CLAUDE_PGID:-100}
      UMASK: ${CLAUDE_UMASK:-002}
      TZ: ${CLAUDE_TZ:-Etc/UTC}
      # No CUSTOM_USER/PASSWORD: the desktop has no login and the reverse proxy
      # (Pangolin) authenticates in front of it.
    ports:
      # 3000 is HTTP for the reverse proxy, 3001 is HTTPS (self-signed) for the
      # LAN. Never publish either to the Internet directly.
      - "${CLAUDE_HTTP_PORT:-3000}:3000"
      - "${CLAUDE_HTTPS_PORT:-3001}:3001"
    volumes:
      # Claude Desktop's sign-in, the keyring, the Chrome profile and the CLI's
      # credentials.
      - "${CLAUDE_STATE:-./appdata}:/config"
      # Your projects.
      - "${CLAUDE_WORKSPACE:-./workspace}:/workspaces"

    # Optional GPU encoding (Intel/AMD, VA-API): uncomment and Selkies picks the
    # render node itself.
    # devices:
    #   - /dev/dri:/dev/dri
