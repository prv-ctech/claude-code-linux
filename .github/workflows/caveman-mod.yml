name: caveman-mod

# Offline tests of mods/caveman-mod's hook, run against temp config dirs.
on:
  pull_request:
    paths:
      - 'mods/caveman-mod/**'
      - '.github/workflows/caveman-mod.yml'
  push:
    branches: [main]
    paths:
      - 'mods/caveman-mod/**'

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Test hook
        run: node --test mods/caveman-mod/test/*.test.js
