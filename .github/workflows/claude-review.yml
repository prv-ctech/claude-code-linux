name: claude-review

# Claude Code reviews every pull request when it opens and again after every
# push to its branch (docs: https://code.claude.com/docs/en/github-actions).
#
# Why a prompt of our own and not the code-review plugin from the docs: that
# plugin stops on any pull request Claude has already commented on, so it
# reviews a pull request once and never again after a push.
#
# Needs, once per repository: the Claude GitHub App installed
# (https://github.com/apps/claude) and a CLAUDE_CODE_OAUTH_TOKEN secret made with
# `claude setup-token`. GitHub withholds secrets from fork pull requests on this
# public repository, so those are not reviewed.

on:
  pull_request:
    types: [opened, synchronize, ready_for_review, reopened]

permissions:
  contents: read
  pull-requests: read
  issues: read
  id-token: write

concurrency:
  # A newer push supersedes a review still running on the old one.
  group: claude-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  review:
    if: ${{ !github.event.pull_request.draft }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 1
      - uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          prompt: |
            Review pull request ${{ github.repository }}#${{ github.event.pull_request.number }}
            at commit ${{ github.event.pull_request.head.sha }}.

            Read the diff with `gh pr diff` and the title, description and existing
            comments with `gh pr view --comments`. Read surrounding code in the checkout
            when a change depends on it.

            Report only high-signal issues in the changed code: bugs that give wrong
            results, crashes, security holes, data loss, broken callers, and clear
            violations of rules written in the repository's CLAUDE.md or docs. Skip style,
            naming, nitpicks and anything you cannot confirm from the code.

            Post each issue as an inline comment on the line concerned with
            mcp__github_inline_comment__create_inline_comment. Do not repeat an issue that
            an earlier comment on this pull request already raised and the new commits did
            not fix. Then post one summary comment with `gh pr comment` that names the
            commit reviewed and lists the issues, or says no issues were found.
          claude_args: |
            --allowedTools "mcp__github_inline_comment__create_inline_comment,Bash(gh pr diff:*),Bash(gh pr view:*),Bash(gh pr comment:*),Read,Grep,Glob"
